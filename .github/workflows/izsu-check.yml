name: izsu-kesinti-kontrol

on:
  schedule:
    - cron: "*/5 * * * *"   # her 5 dakikada bir. GitHub Actions minimum garantisi ~5 dk.
  workflow_dispatch: {}      # manuel tetikleme icin (test amacli)

jobs:
  kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install beautifulsoup4

      - name: Poller calistir
        run: python izsu_poller.py

      - name: state.json degisikligini commit et
        run: |
          git config user.name "izsu-bot"
          git config user.email "izsu-bot@users.noreply.github.com"
          if [ -f state.json ]; then
            git add state.json
            if ! git diff --cached --quiet; then
              git commit -m "state guncelle"
              git push
            else
              echo "state.json degismedi, push atlaniyor."
            fi
          else
            echo "state.json henuz olusmadi, commit atlaniyor."
          fi
